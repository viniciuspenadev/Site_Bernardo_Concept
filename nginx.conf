server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Redirecionamentos relativos: evita expor http:// e a porta 3000 atrás do proxy.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/xml text/xml application/json;

    # O proxy da hospedagem encerra TLS e redireciona HTTP para HTTPS.
    location / {
        try_files $uri $uri/ =404;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
